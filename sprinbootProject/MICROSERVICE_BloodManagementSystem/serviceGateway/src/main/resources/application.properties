spring.application.name=serviceGateway

server.port=9090

eureka.client.service-url.defaultZone=http://localhost:8084/eureka
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.routes[0].id=serviceAdmin
spring.cloud.gateway.routes[0].uri=lb://SERVICEADMIN
spring.cloud.gateway.routes[0].predicates[0]=Path=/admin/**

spring.cloud.gateway.routes[1].id=serviceHospital
spring.cloud.gateway.routes[1].uri=lb://SERVICEHOSPITAL
spring.cloud.gateway.routes[1].predicates[0]=Path=/hospital/**

spring.cloud.gateway.routes[2].id=serviceDonor
spring.cloud.gateway.routes[2].uri=lb://SERVICEDONOR
spring.cloud.gateway.routes[2].predicates[0]=Path=/donor/**

spring.cloud.gateway.routes[3].id=serviceAuth
spring.cloud.gateway.routes[3].uri=lb://SERVICEAUTH
spring.cloud.gateway.routes[3].predicates[0]=Path=/auth/**



management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always