<div class="container mt-5">
    <div class="card shadow p-4 mx-auto" >

        <h2 class="text-center mb-4">Registration Form</h2>

        <form #myform="ngForm" (ngSubmit)="getdata(myform)">

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" name="name" ngModel required minlength="4" #namedata="ngModel"
                    [class.is-invalid]="namedata.touched && namedata.invalid">
            </div>
            <div class="alert alert-danger" *ngIf="namedata.touched && namedata.invalid">
                <div *ngIf="namedata.errors && namedata.errors['required']">
                    enter valid name
                </div>
                <div *ngIf="namedata.errors && namedata.errors['minlength']">
                    name must be minimum 4 characters
                </div>
            </div>  

            <div class="mb-3">
                <label class="form-label">Age</label>
                <input type="number" class="form-control" name="age" ngModel required min="1" #agedata="ngModel"
                    [class.is-invalid]="agedata.touched && agedata.invalid">
            </div>
            <div class="alert alert-danger" *ngIf="agedata.touched && agedata.invalid">
                enter valid age
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" ngModel required #emaildata="ngModel"
                    [class.is-invalid]="emaildata.touched && emaildata.invalid">
            </div>
            <div class="alert alert-danger" *ngIf="emaildata.touched && emaildata.invalid">
                enter valid email
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" ngModel required #passdata="ngModel"
                    [class.is-invalid]="passdata.touched && passdata.invalid">
            </div>
            <div class="alert alert-danger" *ngIf="passdata.touched && passdata.invalid">
                enter password
            </div>

            <div class="mb-3">
                <label class="form-label d-block">Gender</label>

                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" value="male" ngModel required>
                    <label class="form-check-label">Male</label>
                </div>

                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" value="female" ngModel required>
                    <label class="form-check-label">Female</label>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">City</label>
                <select class="form-control" name="city" ngModel required #citydata="ngModel"
                    [class.is-invalid]="citydata.touched && citydata.invalid">
                    <option value="" disabled selected>Select City</option>
                    <option value="Ahmedabad">Ahmedabad</option>
                    <option value="Surat">Surat</option>
                    <option value="Vadodara">Vadodara</option>
                    <option value="Rajkot">Rajkot</option>
                </select>
            </div>
            <div class="alert alert-danger" *ngIf="citydata.touched && citydata.invalid">
                select city
            </div>

            <div class="mb-3">
                <label class="form-label">Subjects</label>
                <div class="form-check">
                    <input class="form-check-input" name="subject" type="checkbox" value="math"
                        (change)="changesubject($event)" ngModel>
                    <label class="form-check-label">Math</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="subject" value="science"
                        (change)="changesubject($event)" ngModel>
                    <label class="form-check-label">Science</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="subject" value="english"
                        (change)="changesubject($event)" ngModel>
                    <label class="form-check-label">English</label>
                </div>

                <div class="alert alert-danger mt-2" *ngIf=" myselectsubject.length == 0">
                    select at least one subject
                </div>
            </div>


            <button type="submit" class="btn btn-primary w-100 mb-3"
                [disabled]="myform.invalid || myselectsubject.length == 0">
                Submit
            </button>


            <div>
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th scope="col">id</th>
                            <th scope="col">name</th>
                            <th scope="col">email</th>
                            <th scope="col">password</th>
                            <th scope="col">subjects</th>
                        </tr>
                    </thead>
                    <tbody >
                        <tr *ngFor="let s of student; index as i">
                            <th scope="row">{{i+1}}</th>
                            <td>{{s.name}}</td>
                            <td>{{s.email}}</td>
                            <td>{{s.password}}</td>
                            <td>{{s.subjects}}</td>
                        </tr>
                    </tbody>
                </table>

            </div>

        </form>

    </div>
</div>
