<div class="card mt-5 shadow-lg border-0">
    <div class="card-body">

        <h3 class="text-center fw-bold mb-3" style="color:#4b49ac;">Student Details</h3>
        <div class="table-responsive">
            <table class="table table-hover text-center align-middle">
                <thead style="background:#4b49ac; color:white;">
                    <tr>
                        <th>id</th>
                        <th>User Id</th>
                        <th>Title</th>
                        <th>Comments</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngIf="singlePost$ | async as post">
                        <td class="fw-bold">{{post.id}}</td>
                        <td>{{post.userId}}</td>
                        <td>{{post.title}}</td>
                        <td>{{post.body}}</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>
