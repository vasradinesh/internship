<table class="table table-striped">
  <thead>
    <tr>
        
      <th scope="col">id</th>
      <th scope="col">name</th>
      <th scope="col">age</th>
      <th scope="col">email</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let data of storedata ; index as i">
      <th scope="row">{{i+1}}</th>
      <td>{{data.name}}</td>
      <td>{{data.age}}</td>
      <td>{{data.email}}</td>
    </tr>
  </tbody>
</table>

<ul>
  <li *ngFor="let User of user">
    {{ User }}
  </li>
</ul>
