<div class="container">

  <h1>event-binding works!</h1>

  <div class="card">
    <h3>1. Event binding by (click)</h3>
    <button  style="background-color: chocolate;" (click)="displaname('dinesh vasra ')" >fullname</button>
    <button style="background-color: chocolate;" (click)="increment()" >increment</button>
    <button style="background-color: chocolate;" (click)="decrement()" >decrement</button>
    <button style="background-color: chocolate;" (click)="reset()" >reset</button>
    <h4 >number : {{counter}}</h4>
    <h4>Full Name : {{name}}</h4>
  </div>

</div>
