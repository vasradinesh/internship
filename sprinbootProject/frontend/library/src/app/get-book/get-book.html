<div class="container mt-5 pt-5">

  <!-- PAGE TITLE -->
  <div class="text-center mb-5">
    <h2 class="fw-bold luxury-title">📚 Library Management</h2>
    <small class="luxury-subtitle">Search, Manage & Control Books</small>
  </div>

  <!-- ================= GET ALL BOOKS ================= -->
  <div class="card luxury-card shadow-sm mb-5 border-0">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0">📖 All Books</h5>
      <button class="btn luxury-btn px-4"
              (click)="getallbooks()">Get All Books</button>
    </div>

    <div class="card-body">

      <div class="table-responsive">
        <table class="table align-middle luxury-table">

          <thead *ngIf="allbooks && allbooks.length > 0">
            <tr>
              <th>Id</th>
              <th>Title</th>
              <th>Author</th>
              <th>Price</th>
              <th class="text-center">Action</th>
            </tr>
          </thead>

          <tbody *ngIf="allbooks && allbooks.length > 0">
            <tr *ngFor="let d of allbooks">
              <td>{{d.bid}}</td>
              <td class="fw-semibold">{{d.title}}</td>
              <td>{{d.author}}</td>
              <td class="price-text">₹{{d.price}}</td>
              <td class="text-center">
                <button class="btn btn-sm luxury-delete-btn"
                        (click)="deletebookbyid(d.bid)">
                  🗑 Delete
                </button>
              </td>
            </tr>
          </tbody>

          <tbody *ngIf="allbooks && allbooks.length == 0">
            <tr>
              <td colspan="5" class="text-center empty-state">
                No books available
              </td>
            </tr>
          </tbody>

        </table>
      </div>

    </div>
  </div>

  <!-- ================= SEARCH BOOK ================= -->
  <div class="card luxury-card shadow-sm border-0">

    <div class="card-header">
      <h5 class="mb-0">🔍 Search Book by ID</h5>
    </div>

    <div class="card-body">

      <div class="row g-3 mb-4 align-items-center">
        <div class="col-md-9">
          <input class="form-control luxury-input"
                 type="number"
                 placeholder="Enter Book ID"
                 #Bid>
        </div>
        <div class="col-md-3">
          <button class="btn luxury-btn w-100"
                  (click)="getbookbyid(Bid.value)">
            Search
          </button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table luxury-table align-middle">

          <thead>
            <tr>
              <th>Id</th>
              <th>Title</th>
              <th>Author</th>
              <th>Price</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngIf="book">
              <td>{{book.bid}}</td>
              <td class="fw-semibold">{{book.title}}</td>
              <td>{{book.author}}</td>
              <td class="price-text">₹{{book.price}}</td>
            </tr>

            <tr *ngIf="!book">
              <td colspan="4" class="text-center empty-state">
                No book found
              </td>
            </tr>
          </tbody>

        </table>
      </div>

    </div>
  </div>

</div>
