<div class="dashboard-wrapper">

  <div class="dashboard-card">

    <h2>Hello</h2>

    <div class="user-info">

      <div class="info-item">
        <label>Email</label>
        <p>{{user?.email}}</p>
      </div>

      <div class="info-item">
        <label>Role</label>
        <p class="role">{{user?.role}}</p>
      </div>

    </div>

    <button class="btn-logout" (click)="logout()">
      Logout
    </button>

  </div>

</div>
