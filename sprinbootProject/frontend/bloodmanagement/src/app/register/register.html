<div class="container-fluid login-wrapper fix-top-space d-flex justify-content-center align-items-center">

  <div class="login-card">

    <!-- Left Branding -->
    <div class="login-left d-none d-md-flex flex-column justify-content-center">
      <h2>Blood Management System</h2>
      <p>Smart. Fast. Life-Saving.</p>
      <div class="pulse-dot"></div>
    </div>

    <!-- Right Form -->
    <div class="login-right">

      <h3 class="text-center fw-bold mb-2">Register</h3>
      <p class="text-center text-muted mb-4">Create your account</p>

      <form [formGroup]="registerForm" (ngSubmit)="register()">

        <!-- Name -->
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" class="form-control" formControlName="name"
            [class.is-invalid]="registerForm.get('name')?.touched && registerForm.get('name')?.invalid">
        </div>

        <!-- Email -->
        <div class="form-group">
          <label>Email</label>
          <input type="email" class="form-control" formControlName="email"
            [class.is-invalid]="registerForm.get('email')?.touched && registerForm.get('email')?.invalid">
        </div>

        <!-- Password -->
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" formControlName="password"
            [class.is-invalid]="registerForm.get('password')?.touched && registerForm.get('password')?.invalid">
        </div>

        <!-- Phone -->
        <div class="form-group">
          <label>Phone</label>
          <input type="text" class="form-control" formControlName="phone">
        </div>

        <!-- Role -->
        <div class="form-group">
          <label>Role</label>
          <select class="form-control" formControlName="role"
            [class.is-invalid]="registerForm.get('role')?.touched && registerForm.get('role')?.invalid">
            <option value="">Select Role</option>
            <option value="USER">User</option>
            <option value="DONOR">Donor</option>
            <option value="HOSPITAL">Hospital</option>
          </select>
        </div>

        <!-- Button -->
        <button type="submit" class="btn btn-danger w-100 mt-3 fw-bold"
          [disabled]="registerForm.invalid">
          Register
        </button>

      </form>

      <!-- Login Link -->
      <div class="text-center mt-3">
        <small>
          Already have an account?
          <a routerLink="/login">Login</a>
        </small>
      </div>

    </div>

  </div>

</div>
