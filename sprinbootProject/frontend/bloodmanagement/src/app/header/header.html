<nav class="navbar custom-navbar px-4">

  <!-- Logo -->
  <a class="navbar-brand d-flex align-items-center" routerLink="/">
    <span class="logo-icon"></span>
    <span class="logo-text">Blood Management</span>
  </a>

  <!-- Right Side -->
  <div class="ms-auto d-flex align-items-center gap-2">

    <!-- NOT LOGGED IN -->
    <ng-container *ngIf="!isLoggedIn(); else loggedInBlock">

      <a routerLink="/login" class="btn btn-outline-light btn-sm px-3">
        Login
      </a>

      <a routerLink="/register" class="btn btn-danger btn-sm px-3">
        Register
      </a>

    </ng-container>

    <!-- LOGGED IN -->
    <ng-template #loggedInBlock>

      <a routerLink="/dashboard" class="btn btn-outline-light btn-sm px-3">
        Dashboard
      </a>

      <button class="btn btn-danger btn-sm px-3" (click)="logout()">
        Logout
      </button>

    </ng-template>

  </div>

</nav>
