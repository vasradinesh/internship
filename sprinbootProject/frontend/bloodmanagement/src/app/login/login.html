<div class="container-fluid login-wrapper d-flex justify-content-center align-items-center">

  <div class="login-card">

    <!-- Left Side Branding -->
    <div class="login-left d-none d-md-flex flex-column justify-content-center">
      <h2>Blood Management System</h2>
      <p>Smart. Fast. Life-Saving.</p>
      <div class="pulse-dot"></div>
    </div>

    <!-- Right Side Form -->
    <div class="login-right">

      <h3 class="text-center fw-bold mb-2">Login</h3>
      <p class="text-center text-muted mb-4">Secure access to your account</p>

      <form [formGroup]="loginForm" (ngSubmit)="login()">

        <!-- Email -->
        <div class="form-group">
          <label>Email</label>
          <input type="email" formControlName="email" class="form-control">
        </div>

        <!-- Password -->
        <div class="form-group">
          <label>Password</label>
          <input type="password" formControlName="password" class="form-control">
        </div>

       <a routerLink="/reset-password" class="text-danger">
  Forgot Password?
</a>

        <!-- Button -->
        <button type="submit" class="btn btn-danger w-100 mt-3" [disabled]="loginForm.invalid">
          Login
        </button>

      </form>

      <!-- Register -->
      <div class="text-center mt-3">
        <small>
          Don't have an account?
          <a routerLink="/register">Register</a>
        </small>
      </div>

    </div>

  </div>

</div>
