<div class="auth-wrapper">

  <div class="auth-card">

    <h4 class="text-center mb-2 fw-bold text-danger">Forgot Password</h4>
    <p class="text-center text-muted mb-4">Enter your email to receive OTP</p>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <!-- Email -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input 
          type="email" 
          formControlName="email"
          class="form-control"
          placeholder="Enter your email"
        >
      </div>

      <!-- Button -->
      <button class="btn btn-danger w-100 fw-bold">
        Send OTP
      </button>

    </form>

  </div>

</div>
