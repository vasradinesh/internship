<div class="container">
  <div class="row">
    <div class="col-md-6 p-4">

      <div class="bg-primary text-white p-2">
        <h2>Add Book</h2>
      </div>

      <form #myForm="ngForm" (ngSubmit)="myBookFormData(myForm.value)">

        <div class="form-group">
          <label>Book ID:</label>
          <input type="number" class="form-control" name="bid" ngModel>
        </div>

        <div class="form-group">
          <label>Title:</label>
          <input type="text" class="form-control" name="title" ngModel>
        </div>

        <div class="form-group">
          <label>Author:</label>
          <input type="text" class="form-control" name="author" ngModel>
        </div>

        <div class="form-group">
          <label>Price:</label>
          <input type="number" class="form-control" name="price" ngModel>
        </div>
        <br>
        <button type="submit" class="btn btn-primary w-100">
          Submit
        </button>
      </form>
    </div>
  </div>
</div>
